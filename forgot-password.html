<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — MODE / ATLAS</title>
  <meta name="description" content="Recover your MODE / ATLAS discovery account access.">
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>

<body>

  <!-- Floating Theme Toggle in Top Right Corner -->
  <div class="auth-theme-corner">
    <button class="theme-toggle-btn" data-action="toggle-theme" aria-label="Toggle Theme">
      <svg class="theme-icon-light" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="5" />
        <line x1="12" y1="1" x2="12" y2="3" />
        <line x1="12" y1="21" x2="12" y2="23" />
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
        <line x1="1" y1="12" x2="3" y2="12" />
        <line x1="21" y1="12" x2="23" y2="12" />
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
      </svg>
      <svg class="theme-icon-dark" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
      </svg>
    </button>
  </div>

  <!-- Center Aligned Authentication Box -->
  <main class="auth-centered-page">
    <div class="auth-card">
      <!-- Brand Name in Top Center Inside the Box -->
      <div class="auth-brand-center">
        <a href="index.html" class="brand-logo"><span>MODE</span><span class="brand-slash">/</span><span>ATLAS</span></a>
      </div>

      <div style="text-align: center; margin-bottom: 2rem;">
        <span class="kicker">ACCOUNT RECOVERY</span>
        <h1 style="font-family: var(--font-editorial); font-size: 2.25rem; margin: 0.4rem 0 0.5rem; font-weight: 400;">
          Forgot Password
        </h1>
        <p style="color: var(--text-secondary); font-size: 0.875rem;">
          Enter the email associated with your account and we will send you instructions to reset your password.
        </p>
      </div>

      <form id="forgotPasswordForm">
        <div class="form-group">
          <label for="forgotEmail" class="form-label">Email Address</label>
          <input type="email" id="forgotEmail" required class="form-input" placeholder="name@domain.com" autocomplete="email">
        </div>

        <div id="forgotPasswordFeedback" style="display: none; padding: 0.85rem 1rem; border-radius: var(--radius-sm); background-color: var(--badge-bg); border: 1px solid var(--border-medium); font-size: 0.8125rem; color: var(--accent-rust); margin-bottom: 1.25rem;">
          ✓ If an account exists with this email, a reset dispatch has been sent.
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.9rem; font-size: 0.95rem;">
          Send Reset Link
        </button>
      </form>

      <div style="margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--border-subtle); text-align: center; font-size: 0.85rem; color: var(--text-secondary);">
        Remember your password? <a href="login.html" style="color: var(--accent-rust); font-weight: 600;">Back to Sign In</a>
      </div>
    </div>
  </main>

  <div class="toast-container"></div>

  <!-- Scripts -->
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/bookmarks.js"></script>
  <script src="assets/js/main.js"></script>
</body>

</html>
