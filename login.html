<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — MODE / ATLAS</title>
  <meta name="description"
    content="Sign in to your MODE / ATLAS discovery account to bookmark and sync global fashion pieces.">
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>

<body>

  <!-- Floating Theme Toggle in Top Right Corner -->
  <div class="auth-theme-corner">
    <button class="theme-toggle-btn" data-action="toggle-theme" aria-label="Toggle Theme">
      <svg class="theme-icon-light" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="5" />
        <line x1="12" y1="1" x2="12" y2="3" />
        <line x1="12" y1="21" x2="12" y2="23" />
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
        <line x1="1" y1="12" x2="3" y2="12" />
        <line x1="21" y1="12" x2="23" y2="12" />
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
      </svg>
      <svg class="theme-icon-dark" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
      </svg>
    </button>
  </div>

  <!-- Center Aligned Authentication Box -->
  <main class="auth-centered-page">
    <div class="auth-card">
      <!-- Brand Name in Top Center Inside the Box -->
      <div class="auth-brand-center">
        <a href="index.html" class="brand-logo"><span>MODE</span><span class="brand-slash">/</span><span>ATLAS</span></a>
      </div>

      <div style="text-align: center; margin-bottom: 2rem;">
        <span class="kicker">WELCOME BACK</span>
        <h1 style="font-family: var(--font-editorial); font-size: 2.25rem; margin: 0.4rem 0 0.5rem; font-weight: 400;">
          Sign In
        </h1>
        <p style="color: var(--text-secondary); font-size: 0.875rem;">
          Access your saved fashion discoveries and curated collections.
        </p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail" class="form-label">Email Address</label>
          <input type="email" id="loginEmail" required class="form-input" placeholder="name@domain.com" autocomplete="email">
        </div>

        <div class="form-group">
          <label for="loginPassword" class="form-label">Password</label>
          <div class="password-field-wrap">
            <input type="password" id="loginPassword" required class="form-input" placeholder="••••••••" autocomplete="current-password">
            <button type="button" class="password-toggle-btn" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Remember Me and Forgot Password on the Same Line -->
        <div class="form-group" style="display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; flex-wrap: wrap;">
          <label class="form-checkbox-label">
            <input type="checkbox" checked>
            <span>Remember me</span>
          </label>
          <a href="forgot-password.html" style="font-size: 0.8125rem; color: var(--accent-rust); text-decoration: none;">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.9rem; font-size: 0.95rem; margin-top: 0.5rem;">
          Sign In to Discoveries
        </button>
      </form>

      <!-- Google and Apple Social Icons / Buttons at the Bottom -->
      <div class="auth-divider">
        <span>OR CONTINUE WITH</span>
      </div>

      <div class="auth-social-buttons">
        <button type="button" class="btn-social" aria-label="Sign in with Google" onclick="window.ModeToast?.show('Google authentication initialized')">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24z"/>
            <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.98 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
          </svg>
          <span>Google</span>
        </button>
        <button type="button" class="btn-social" aria-label="Sign in with Apple" onclick="window.ModeToast?.show('Apple ID authentication initialized')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.38c.62-.75 1.04-1.8 0.92-2.85-.9.04-1.98.6-2.61 1.34-.55.63-1.03 1.68-.9 2.71 1 .08 2.03-.5 2.59-1.2z"/>
          </svg>
          <span>Apple</span>
        </button>
      </div>

      <div style="margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border-subtle); text-align: center; font-size: 0.85rem; color: var(--text-secondary);">
        New to MODE / ATLAS? <a href="signup.html" style="color: var(--accent-rust); font-weight: 600;">Create Account</a>
      </div>
    </div>
  </main>

  <button id="backToTopBtn" class="back-to-top-btn" aria-label="Back to top">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <path d="M18 15l-6-6-6 6"/>
    </svg>
  </button>

  <div class="toast-container"></div>

  <!-- Scripts -->
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/bookmarks.js"></script>
  <script src="assets/js/main.js"></script>
</body>

</html>
